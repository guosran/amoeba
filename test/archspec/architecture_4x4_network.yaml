    - {src_row: 2, src_column: 3, dst_row: 2, dst_column: 2, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 2, src_column: 3, dst_row: 3, dst_column: 3, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
