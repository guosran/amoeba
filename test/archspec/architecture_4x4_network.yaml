    - {src_row: 1, src_column: 0, dst_row: 1, dst_column: 1, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 0, dst_row: 2, dst_column: 0, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 2, src_column: 0, dst_row: 1, dst_column: 0, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
