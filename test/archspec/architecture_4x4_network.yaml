architecture:
  name: "NeuraMultiCgra"
  version: "1.0"

multi_cgra_defaults:
  base_topology: "mesh"
  rows: 4
  columns: 4

per_cgra_defaults:
  rows: 4
  columns: 4
  ctrl_mem_items: 20
  base_topology: "mesh"

tile_defaults:
  num_registers: 32
  fu_types: ["add", "mul", "div", "fadd", "fmul", "fdiv", "logic", "cmp", "sel", "type_conv", "vfmul", "fadd_fadd", "fmul_fadd", "grant", "loop_control", "phi", "constant", "mem", "return", "mem_indexed", "alloca", "shift", "counter", "extract_predicate"]

link_defaults:
  latency: 1
  bandwidth: 32

link_overrides:

tile_overrides:

extensions:
  crossbar: false

simulator:
  execution_model: "serial"

  logging:
    enabled: true
    file: "output.log"

  driver:
    name: "Driver"
    frequency: "1GHz"

  device:
    name: "Device"
    frequency: "1GHz"
    bind_to_architecture: true
inter_task_network:
  version: 1
  rows: 4
  columns: 4
  local_bandwidth_bits_per_cycle: 32
  links:
    - {src_row: 0, src_column: 0, dst_row: 0, dst_column: 1, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 1, dst_row: 0, dst_column: 0, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 1, dst_row: 0, dst_column: 2, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 2, dst_row: 0, dst_column: 1, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 2, dst_row: 0, dst_column: 3, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 3, dst_row: 0, dst_column: 2, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 0, src_column: 3, dst_row: 1, dst_column: 3, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 3, dst_row: 0, dst_column: 3, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 3, dst_row: 1, dst_column: 2, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 2, dst_row: 1, dst_column: 3, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 2, dst_row: 1, dst_column: 1, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
    - {src_row: 1, src_column: 1, dst_row: 1, dst_column: 2, latency_cycles: 1, bandwidth_bits_per_cycle: 32}
